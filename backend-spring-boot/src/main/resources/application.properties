server.port=8080

# Spring Application Name
spring.application.name=fizzdrop-backend

# Datasource configuration for MySQL
# Default connects to MySQL local instance on 3306; can be overridden via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fizzdrop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow large image payloads (e.g. base64 beverage bottle renders)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson JSON config
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# H2 Console (available when running in memory profile if MySQL is unreachable)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
